name = "formapubli"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
# DIAG 1101 (tam thoi): fail-fast thay vi treo câm khi promise dung chung
# state giua cac request — bien 1101 "hung" thanh loi doc duoc.
# Xem: https://developers.cloudflare.com/workers/observability/errors/
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# Bắt buộc cho Next 14 trên Workers: chạy server ở minimal mode (y hệt
# `next start` production) để bỏ qua require middleware-manifest động
# (workerd không hỗ trợ dynamic require đường dẫn file). Thiếu biến này mọi
# function 500 với lỗi "Dynamic require ... middleware-manifest.json".
NEXT_PRIVATE_MINIMAL_MODE = "1"
# Cờ lộ UI Shopee (tab + panel Cài Đặt). Tắt/bật không cần sửa code — đổi giá
# trị này rồi deploy lại. SHOPEE_UI_ENABLED=0 là ẩn hoàn toàn.
SHOPEE_UI_ENABLED = "1"
