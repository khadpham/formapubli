name: Chốt ca & chốt ngày tự động

# SAFEGUARD: thu ngân quên chốt ca thì ca treo vô hạn, ngày không chốt, số
# liệu sai. Job này gọi endpoint /api/cron/auto-close — endpoint tự chốt các
# ca quá giờ rồi chốt ngày nghiệp vụ đã qua, idempotent nên chạy lại vô hại.
#
# VÌ SAO KHÔNG DÙNG CRON CỦA CLOUDFLARE: worker do @opennextjs/cloudflare sinh
# ra chỉ có export `fetch`, KHÔNG có `scheduled`. Khai báo [triggers] crons sẽ
# bắn sự kiện vào chỗ không ai nghe → tính năng chết mà KHÔNG báo lỗi.
# scripts/test-cron-auto-close.ts khoá lại điều này.

on:
  schedule:
    # 23:40 giờ VN = 16:40 UTC. Sau giờ cắt chốt của từng kho, trước nửa đêm.
    - cron: '40 16 * * *'
  workflow_dispatch:

concurrency:
  group: auto-close-shift
  cancel-in-progress: false

jobs:
  auto-close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quét từng kho, mỗi kho một lần gọi
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ]; then
            echo "::error::Thiếu repository variable APP_URL"
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Thiếu secret CRON_SECRET"
            exit 1
          fi
          AUTH="Authorization: Bearer ${CRON_SECRET}"

          # Cloudflare WAF của book.formaform.vn có managed challenge và chặn IP
          # datacenter (mà GitHub Actions chạy trên đó) → 403 trang "Just a moment".
          # Endpoint không cần challenge nên gọi thẳng URL worker.
          if curl -sS --max-time 30 "${APP_URL}/api/cron/auto-close?list=1" -H "${AUTH}" \
               | grep -q "Just a moment"; then
            echo "::error::APP_URL đang bị Cloudflare challenge (403). Đổi APP_URL sang URL worker https://<worker>.workers.dev"
            exit 1
          fi

          # Worker có giới hạn subrequest mỗi lần gọi: quét nhiều kho trong
          # MỘT lần gọi sẽ chết với "Too many subrequests". Nên lấy danh sách
          # kho, rồi gọi RIÊNG từng kho — mỗi lần gọi có hạn mức riêng.
          list_code=$(curl -sS -o /tmp/kho.json -w '%{http_code}' \
            "${APP_URL}/api/cron/auto-close?list=1" -H "${AUTH}" --max-time 60)
          if [ "$list_code" != "200" ]; then
            echo "::error::Không lấy được danh sách kho (HTTP ${list_code})"
            cat /tmp/kho.json; echo
            exit 1
          fi

          codes=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).data.warehouses.map(w=>w.code).join("\n"))})' < /tmp/kho.json)
          total=$(printf '%s\n' "$codes" | grep -c . || true)
          echo "Có ${total} kho cần quét"
          if [ "$total" -eq 0 ]; then
            echo "::error::Danh sách kho rỗng — KHÔNG coi là thành công"
            exit 1
          fi

          failed=0
          # Quét N ngày gần nhất, không chỉ hôm qua: nếu cron chết vài ngày thì
          # những ngày đó chưa từng được chốt. Mỗi (kho × ngày) là MỘT lần gọi
          # riêng nên không vỡ giới hạn subrequest của Worker.
          BACK_DAYS=7
          while IFS= read -r code; do
            [ -z "$code" ] && continue
            for ((back = 1; back <= BACK_DAYS; back++)); do
              day=$(node -e 'const d=new Date(Date.now()-Number(process.argv[1])*86400000);process.stdout.write(d.toLocaleDateString("en-CA",{timeZone:"Asia/Ho_Chi_Minh"}))' "$back")
              out="/tmp/kho-${code}-${day}.json"
              http=$(curl -sS -o "$out" -w '%{http_code}' \
                -X POST "${APP_URL}/api/cron/auto-close?warehouse=${code}&date=${day}" \
                -H "${AUTH}" --max-time 120)
              if [ "$http" = "401" ]; then
                echo "::error::Safeguard từ chối: CRON_SECRET sai hoặc chưa được set"
                exit 1
              fi
              if [ "$http" -ge 400 ]; then
                echo "--- ${code} ${day}: HTTP ${http}"
                head -c 400 "$out"; echo
                echo "::error::Kho ${code} ngày ${day} lỗi (HTTP ${http})"
                failed=1
                continue
              fi
              # 200 nhưng payload có errors[]/truncated = chưa xong, KHÔNG im lặng.
              if node -e '
                let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const d=(JSON.parse(s).data)||{};
                const e=d.errors||[], t=d.truncated||[];
                if(!e.length&&!t.length&&!(d.shiftsClosed||[]).length&&!(d.daysClosed||[]).length) process.exit(0);
                const c=(d.shiftsClosed||[]).length, y=(d.daysClosed||[]).length;
                if(e.length||t.length) console.error(`  ca=${c} ngay=${y}`+(t.length?` BO SOT ${t.length} ca`:"")+(e.length?` LOI: ${e.map(x=>x.step+": "+x.error).join("; ")}`:""));
                process.exit(e.length||t.length?1:0);
              });' < "$out"; then
                :
              else
                failed=1
              fi
            done
          done <<< "$codes"

          if [ "$failed" -ne 0 ]; then
            echo "::error::Có kho/ngày chưa chốt được — xem log ở trên"
            exit 1
          fi
          echo "Đã quét đủ ${total} kho × ${BACK_DAYS} ngày"
